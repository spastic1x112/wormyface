
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormGPT | Adversarial AI Terminal Console</title>
    <meta name="description" content="An authentic replica of WormGPT - an adversarial cybersecurity AI workstation and terminal console.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;
            color: #ecfdf5;
            font-family: 'Fira Code', monospace;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }
        
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
            z-index: 100;
        }

        .glow-green { text-shadow: 0 0 10px rgba(34, 197, 94, 0.6); }
        .glow-red { text-shadow: 0 0 15px rgba(239, 68, 68, 0.9); }

        .glass-panel {
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar { width: 2px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.5); border-radius: 10px; }

        .flicker { animation: flicker 0.15s infinite; }
        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "react-markdown": "https://esm.sh/react-markdown@^9.0.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="flicker">
    <canvas id="matrix-canvas"></canvas>
    <div id="root" class="relative z-10 h-full"></div>
    <div class="crt-overlay"></div>
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, columns, drops;

        function initMatrix() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.floor(width / 18);
            drops = new Array(columns).fill(1);
        }

        let matrixColor = '#22c55e';
        const characters = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";

        function draw() {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.08)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = matrixColor;
            ctx.font = '14px Fira Code';
            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * 18, drops[i] * 18);
                if (drops[i] * 18 > height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            }
        }
        
        initMatrix();
        setInterval(draw, 45);
        window.addEventListener('resize', initMatrix);
        window.setMatrixColor = (color) => { matrixColor = color; };
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
